<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>雾之春小测试</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",system-ui,-apple-system;}

body{
  background:#12141c;
  color:#e8e8ef;
  max-width:680px;
  margin:0 auto;
  padding:24px 16px;
  min-height:100vh;
  transition: background 0.7s ease;
}

body.res-gov{
  background:#171b36;
}
body.res-shadow{
  background:#0b0c0f;
}
body.res-life{
  background:#142416;
}
body.res-steel{
  background:#230d10;
}

/* ===== 开幕欢迎页 ===== */
.splash-wrap{
  position:fixed;
  inset:0;
  background:#12141c;
  z-index:99;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:32px 24px;
  opacity:1;
  transition:opacity 0.6s ease;
}
.splash-wrap.fadeout{
  opacity:0;
  pointer-events:none;
}
.splash-text{
  max-width:580px;
  font-size:17px;
  line-height:2;
  text-align:center;
  min-height:140px;
}
.splash-caret{
  display:inline-block;
  width:7px;
  margin-left:2px;
  background:#949cb8;
  animation:blink 0.8s infinite;
}
#startBtn{
  margin-top:36px;
  padding:14px 36px;
  background:#5865d8;
  color:#fff;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
  opacity:0;
  transition:opacity 0.5s;
}
#startBtn.show-btn{
  opacity:1;
}
#startBtn:hover{
  background:#4752bc;
}

.wrap{padding:8px;display:none;}
.wrap.show-wrap{
  display:block;
}

.title-block{
  text-align:center;
  margin-bottom:32px;
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.title-block.hidden-title{
  opacity:0;
  pointer-events:none;
  transform: translateY(-12px);
}
.title-block h1{font-size:24px;margin-bottom:12px;color:#cad2ff;}
.title-block p{opacity:0.75;line-height:1.6;font-size:15px;}

.question{
  display:none;
  opacity:0;
  transform:translateY(12px);
  transition:opacity 0.35s ease, transform 0.35s ease;
  margin-bottom:20px;
}
.question.active{
  display:block;
  opacity:1;
  transform:translateY(0);
}

.q-text{
  font-size:16px;
  line-height:1.7;
  margin-bottom:18px;
  min-height:3em;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.caret{
  display:inline-block;
  width:7px;
  margin-left:2px;
  background:#949cb8;
  animation:blink 0.8s infinite;
}
@keyframes blink{
  50%{opacity:0;}
}

.opt-btn{
  width:100%;
  text-align:left;
  padding:14px 16px;
  margin:10px 0;
  background:#222638;
  border:1px solid #373c54;
  color:#e8e8ef;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
  transition:0.2s;
}
.opt-btn:hover{background:#2d324a;border-color:#50587c;}

.result-page{
  display:none;
  margin-top:40px;
  text-align:center;
  padding:28px 24px;
  border-radius:18px;
  position:relative;
  overflow:hidden;
}
.result-page h2{
  font-size:26px;
  margin-bottom:16px;
  position:relative;
  z-index:2;
}
.res-desc{
  margin:24px 0;
  font-size:16px;
  line-height:1.8;
  position:relative;
  z-index:2;
  white-space:pre-wrap;
}
.restart-btn{
  padding:12px 28px;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
  position:relative;
  z-index:2;
}
.tip{margin-top:24px;font-size:13px;opacity:0.65;position:relative;z-index:2;}

/* 秩序政府 紫蓝色 */
.result-gov{
  background:
    radial-gradient(circle at top left, rgba(120,110,255,0.35), transparent 45%),
    radial-gradient(circle at bottom right, rgba(74,134,255,0.25), transparent 45%),
    linear-gradient(160deg, #1a1f3a, #24305e);
  border:1px solid rgba(138,148,255,0.45);
  box-shadow:
    0 0 0 1px rgba(138,148,255,0.25) inset,
    0 18px 45px rgba(60,80,180,0.35);
  color:#eef2ff;
}
.result-gov h2{color:#d9deff;text-shadow:0 0 18px rgba(138,148,255,0.5);}
.result-gov .restart-btn{background:#5b6cdf;color:#fff;}
.result-gov .restart-btn:hover{background:#4a59c4;}

.result-gov.show{animation:govShow 1s ease forwards;}
@keyframes govShow{
  0%{opacity:0;transform:translateY(24px) scale(0.96);box-shadow:0 0 0 rgba(138,148,255,0);}
  60%{opacity:1;transform:translateY(-4px) scale(1.01);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}

.result-gov::before{
  content:"";
  position:absolute;inset:0;
  background:
    radial-gradient(circle at 20% 20%, rgba(180,190,255,0.25), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(90,120,255,0.18), transparent 50%);
  opacity:0;
  animation:govLight 2.4s ease-in-out infinite alternate;
  pointer-events:none;
}
@keyframes govLight{
  from{opacity:0.35;}
  to{opacity:0.75;}
}

/* 暗影行会 黑白 */
.result-shadow{
  background:
    radial-gradient(circle at top right, rgba(255,255,255,0.08), transparent 40%),
    linear-gradient(160deg, #0f1014, #1c1d22);
  border:1px solid rgba(255,255,255,0.18);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.08) inset,
    0 18px 45px rgba(0,0,0,0.5);
  color:#f1f1f3;
}
.result-shadow h2{color:#ffffff;text-shadow:0 0 14px rgba(255,255,255,0.25);letter-spacing:2px;}
.result-shadow .restart-btn{background:#2a2c33;color:#fff;border:1px solid #4a4c54;}
.result-shadow .restart-btn:hover{background:#3a3c44;}

.result-shadow.show{animation:shadowShow 1.1s ease forwards;}
@keyframes shadowShow{
  0%{opacity:0;filter:brightness(0.4) contrast(1.6);transform:translateY(18px);}
  30%{opacity:0.55;filter:brightness(1.1) contrast(1.2);}
  60%{opacity:0.85;filter:brightness(0.95) contrast(1.05);}
  100%{opacity:1;filter:brightness(1) contrast(1);transform:translateY(0);}
}

.result-shadow::before{
  content:"";
  position:absolute;inset:0;
  background-image:
    radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size:3px 3px;
  opacity:0.4;
  pointer-events:none;
}

/* 生命织缕 金绿 */
.result-life{
  background:
    radial-gradient(circle at top left, rgba(210,255,130,0.3), transparent 45%),
    radial-gradient(circle at bottom right, rgba(255,220,110,0.28), transparent 45%),
    linear-gradient(160deg, #172a18, #2f4a24);
  border:1px solid rgba(195,255,135,0.4);
  box-shadow:
    0 0 0 1px rgba(195,255,135,0.25) inset,
    0 18px 45px rgba(80,140,60,0.35);
  color:#f3ffe2;
}
.result-life h2{color:#e4ffb7;text-shadow:0 0 18px rgba(195,255,135,0.45);}
.result-life .restart-btn{background:#7da844;color:#fff;}
.result-life .restart-btn:hover{background:#6b9239;}

.result-life.show{animation:lifeShow 1.2s ease forwards;}
@keyframes lifeShow{
  0%{opacity:0;transform:scale(0.85) translateY(20px);filter:blur(6px);}
  100%{opacity:1;transform:scale(1) translateY(0);filter:blur(0);}
}

.life-particle{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,230,140,0.9), rgba(195,255,135,0.4));
  box-shadow:0 0 10px rgba(255,230,140,0.6);
  pointer-events:none;
  opacity:0;
  animation:lifeParticle 2.6s ease-out infinite;
}
@keyframes lifeParticle{
  0%{transform:translate(0,0) scale(0.4);opacity:0;}
  30%{opacity:1;}
  100%{transform:translate(30px,-90px) scale(1);opacity:0;}
}

/* 钢铁圣所 红白 */
.result-steel{
  background:
    radial-gradient(circle at top right, rgba(255,90,90,0.3), transparent 45%),
    linear-gradient(160deg, #2a0f12, #5c1f25);
  border:1px solid rgba(255,180,180,0.4);
  box-shadow:
    0 0 0 1px rgba(255,220,220,0.2) inset,
    0 18px 45px rgba(180,40,40,0.45);
  color:#fff1f1;
}
.result-steel h2{color:#ffffff;text-shadow:0 0 16px rgba(255,110,110,0.5);letter-spacing:2px;}
.result-steel .restart-btn{background:#c0392b;color:#fff;}
.result-steel .restart-btn:hover{background:#a22e22;}

.result-steel.show{animation:steelShow 1s ease forwards;}
@keyframes steelShow{
  0%{opacity:0;transform:translateY(28px) scaleX(0.9);}
  60%{opacity:1;transform:translateY(-6px) scaleX(1.02);}
  100%{opacity:1;transform:translateY(0) scaleX(1);}
}

.result-steel::after{
  content:"";
  position:absolute;
  top:0;left:-70%;
  width:40%;height:100%;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,0.18), transparent);
  transform:skewX(-20deg);
  animation:steelSweep 2.2s ease-in-out infinite;
  pointer-events:none;
}
@keyframes steelSweep{
  0%{left:-70%;}
  60%{left:130%;}
  100%{left:130%;}
}
</style>
</head>

};

const resultClassMap = {
  gov:"result-gov",
  shadow:"result-shadow",
  steel:"result-steel",
  life:"result-life"
};
const bodyClassMap = {
  gov:"res-gov",
  shadow:"res-shadow",
  steel:"res-steel",
  life:"res-life"
};

let currentIdx = 0;
let typeTimer = null;
let splashTimer = null;

const container = document.getElementById("quiz-container");
const resultWrap = document.getElementById("resultWrap");
const bodyEl = document.body;
const titleBlock = document.getElementById("titleBlock");
const resultHeading = document.getElementById("resultHeading");
const splashWrap = document.getElementById("splashWrap");
const splashTextEl = document.getElementById("splashText");
const startBtn = document.getElementById("startBtn");
const mainWrap = document.getElementById("mainWrap");

// 开幕打字
function splashType(text, speed=35){
  let i=0;
  splashTextEl.innerHTML = "";
  splashTimer = setInterval(()=>{
    if(i<text.length){
      splashTextEl.innerHTML = text.substring(0,i+1)+`<span class="splash-caret"></span>`;
      i++;
    }else{
      clearInterval(splashTimer);
      splashTimer=null;
      splashTextEl.innerHTML = text;
      startBtn.classList.add("show-btn");
    }
  },speed);
}

// 点击开始，淡出开幕，进入答题
startBtn.onclick = ()=>{
  if(splashTimer){clearInterval(splashTimer);splashTimer=null;}
  splashWrap.classList.add("fadeout");
  setTimeout(()=>{
    splashWrap.style.display="none";
    mainWrap.classList.add("show-wrap");
    renderQuestion();
  },600);
};

function typeWriter(element, text, speed = 32){
  let i = 0;
  element.innerHTML = "";
  if(typeTimer){
    clearInterval(typeTimer);
    typeTimer = null;
  }
  typeTimer = setInterval(()=>{
    if(i < text.length){
      element.innerHTML = text.substring(0, i + 1) + `<span class="caret"></span>`;
      i++;
    }else{
      clearInterval(typeTimer);
      typeTimer = null;
      element.innerHTML = text;
    }
  }, speed);
}

function renderQuestion(){
  container.innerHTML = "";
  const item = questionList[currentIdx];
  const divQ = document.createElement("div");
  divQ.className = "question";

  if(item.isBranch){
    divQ.innerHTML = `
      <div class="q-text"></div>
      <button class="opt-btn" id="btnContinue">继续完成后面3道娱乐题目</button>
      <button class="opt-btn" id="btnSkip">✅ 跳过这3道题，直接查看测试结果</button>
    `;
    container.appendChild(divQ);
    requestAnimationFrame(()=>{
      divQ.classList.add("active");
      const qTextEl = divQ.querySelector(".q-text");
      typeWriter(qTextEl, item.q);

      document.getElementById("btnContinue").onclick = ()=>{
        if(typeTimer){clearInterval(typeTimer);typeTimer=null;}
        goNext();
      };
      document.getElementById("btnSkip").onclick = ()=>{
        if(typeTimer){clearInterval(typeTimer);typeTimer=null;}
        showResult();
      };
    });
    return;
  }

  // --------重点：删掉了自动生成的q-num自动题号行！！--------
  divQ.innerHTML = `
    <div class="q-text"></div>
  `;

  item.options.forEach(opt=>{
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.innerText = opt.txt;
    btn.onclick = ()=>{
      if(typeTimer){
        clearInterval(typeTimer);
        typeTimer = null;
      }
      if(opt.points.gov) score.gov += opt.points.gov;
      if(opt.points.shadow) score.shadow += opt.points.shadow;
      if(opt.points.steel) score.steel += opt.points.steel;
      if(opt.points.life) score.life += opt.points.life;
      goNext();
    };
    divQ.appendChild(btn);
  });

  container.appendChild(divQ);
  requestAnimationFrame(()=>{
    divQ.classList.add("active");
    const qTextEl = divQ.querySelector(".q-text");
    typeWriter(qTextEl, item.q);
  });
}

function goNext(){
  const current = container.querySelector(".question");
  if(current){
    current.classList.remove("active");
  }
  setTimeout(()=>{
    currentIdx++;
    if(currentIdx >= questionList.length){
      showResult();
      return;
    }
    renderQuestion();
  }, 220);
}

function showResult(){
  container.style.display = "none";
  resultWrap.style.display = "block";
  titleBlock.classList.add("hidden-title");

  const arr = [
    {key:"gov",val:score.gov},
    {key:"shadow",val:score.shadow},
    {key:"steel",val:score.steel},
    {key:"life",val:score.life}
  ];
  arr.sort((a,b)=>b.val - a.val);
  const topKey = arr[0].key;

  resultWrap.className = "result-page";
  resultWrap.classList.add(resultClassMap[topKey]);
  bodyEl.className = "";
  bodyEl.classList.add(bodyClassMap[topKey]);

  resultHeading.innerText = formalTitleMap[topKey];
  document.getElementById("resultText").innerText = resultTextMap[topKey];

  if(topKey === "life"){
    addLifeParticles(resultWrap);
  }

  requestAnimationFrame(()=>{
    resultWrap.classList.add("show");
  });
}

function addLifeParticles(parent){
  parent.querySelectorAll(".life-particle").forEach(p=>p.remove());
  for(let i = 0; i < 10; i++){
    const p = document.createElement("span");
    p.className = "life-particle";
    p.style.left = Math.random() * 100 + "%";
    p.style.top = 40 + Math.random() * 50 + "%";
    p.style.animationDelay = Math.random() * 2 + "s";
    p.style.animationDuration = (2 + Math.random() * 1.6) + "s";
    parent.appendChild(p);
  }
}

function restartQuiz(){
  if(typeTimer){
    clearInterval(typeTimer);
    typeTimer = null;
  }
  score = {gov:0,shadow:0,steel:0,life:0};
  currentIdx = 0;
  resultWrap.classList.remove("show");

  setTimeout(()=>{
    resultWrap.style.display = "none";
    resultWrap.className = "result-page";
    resultWrap.querySelectorAll(".life-particle").forEach(p=>p.remove());
    bodyEl.className = "";
    titleBlock.classList.remove("hidden-title");
    container.style.display = "block";
    renderQuestion();
  }, 300);
}

// 页面加载完成启动开幕打字
splashType(splashContent);
</script>
</body>
</html>
